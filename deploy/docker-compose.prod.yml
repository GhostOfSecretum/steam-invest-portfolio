# Production overlay: adds a Caddy TLS reverse proxy in front of the app.
#
# Usage (from the repo root):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   - A domain whose DNS A/AAAA record points to this server.
#   - SESSION_SECRET set in .env (required in production; app refuses to start otherwise).
#   - Edit deploy/Caddyfile and replace your-domain.com.
services:
  steam-invest-app:
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      APP_BASE_URL: ${APP_BASE_URL:-https://skinshead.pro}

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - steam-invest-app

volumes:
  caddy-data:
  caddy-config:
