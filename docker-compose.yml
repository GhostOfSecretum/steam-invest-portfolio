services:
  xray-config:
    build: .
    user: "0:0"
    command: node scripts/generate-xray-config.js
    env_file:
      - .env
    environment:
      XRAY_CONFIG_PATH: /etc/xray/config.json
    volumes:
      - xray-config:/etc/xray

  xray:
    # Pinned to a specific release instead of :latest for reproducible, auditable builds.
    image: ghcr.io/xtls/xray-core:v26.3.27
    restart: unless-stopped
    command: run -c /etc/xray/config.json
    volumes:
      - xray-config:/etc/xray:ro
    depends_on:
      xray-config:
        condition: service_completed_successfully

  app:
    build: .
    user: node
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_PROXY_HOST: ${TELEGRAM_PROXY_HOST:-xray}
      TELEGRAM_PROXY_PORT: ${TELEGRAM_PROXY_PORT:-1080}
    volumes:
      - ./.data:/app/.data
    ports:
      # Bind to localhost only: the app speaks plain HTTP, so it must sit behind a
      # TLS-terminating reverse proxy (see caddy example) rather than be exposed
      # directly. Override APP_BIND=0.0.0.0 only if you know what you are doing.
      - "${APP_BIND:-127.0.0.1}:${PORT:-3000}:3000"
    depends_on:
      - xray

volumes:
  xray-config:
