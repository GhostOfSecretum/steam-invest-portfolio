# Run all commands from this repo root (/opt/steam-invest-portfolio on the server):
#   docker compose up -d --build
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
name: steam-invest

services:
  steam-invest-app:
    build: .
    image: steam-invest-app:latest
    container_name: steam-invest-app
    user: "0:0"
    entrypoint: ["/app/scripts/docker-app-entrypoint.sh"]
    command: ["node", "server/index.js"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.data:/app/.data
    ports:
      - "${APP_BIND:-127.0.0.1}:${PORT:-3000}:3000"
    networks:
      - default
      - proxy

  steam-invest-desk:
    image: steam-invest-app:latest
    build: .
    container_name: steam-invest-desk
    user: "0:0"
    entrypoint: ["/app/scripts/docker-app-entrypoint.sh"]
    command: ["node", "scripts/x-desk.js"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      X_DESK_BIND: "0.0.0.0"
      X_DESK_PORT: "3847"
      X_DESK_DATA: /app/.data/x-desk.json
    volumes:
      - ./.data:/app/.data
      - ./output:/app/output:ro
      - ./assets/fonts:/app/assets/fonts:ro
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_DOCKER_NETWORK:-mysterium-tech-landing_default}
