<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Storage · QR login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c11; color: #e8e6e3; font-family: -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px; text-align: center;
    }
    h1 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
    p { font-size: 13px; color: #7a7874; line-height: 1.5; max-width: 320px; margin-bottom: 16px; }
    #qr { width: 280px; height: 280px; background: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    #qr img { width: 260px; height: 260px; }
    .ok { color: #34d399; margin-top: 16px; font-size: 13px; }
    .err { color: #ef4444; margin-top: 16px; font-size: 13px; }
    .loading { color: #f59e0b; font-size: 12px; font-family: monospace; }
  </style>
</head>
<body>
  <h1 id="qr-title">Scan in Steam Mobile</h1>
  <p id="qr-body">Steam issues a full-access token — it cannot issue a limited one. We only read Storage contents and do not move or trade items. The token stays on this computer and is never sent to the server.</p>
  <div id="qr"><span class="loading">Loading QR…</span></div>
  <div id="status"></div>
  <script>
    let lang = window.i18n.defaultLang;
    let lastAccountName = '';

    function t(key, vars) {
      return window.i18n.t(lang, key, vars);
    }

    function applyI18n() {
      document.documentElement.lang = window.i18n.htmlLangFor(lang);
      document.title = t('qrWindowTitle');
      document.getElementById('qr-title').textContent = t('qrTitle');
      document.getElementById('qr-body').textContent = t('qrBody');
      const loading = document.querySelector('#qr .loading');
      if (loading) loading.textContent = t('qrLoading');
      if (lastAccountName) {
        const status = document.getElementById('status');
        status.className = 'ok';
        status.textContent = t('qrConnected', { accountName: lastAccountName });
      }
    }

    window.gcQr.getLang().then((nextLang) => {
      lang = window.i18n.normalize(nextLang);
      applyI18n();
    });
    window.gcQr.onLangChanged((nextLang) => {
      lang = window.i18n.normalize(nextLang);
      applyI18n();
    });
    window.gcQr.onQrImage((dataUrl) => {
      document.getElementById('qr').innerHTML = `<img src="${dataUrl}" alt="Steam QR">`;
    });
    window.gcQr.onLoginSuccess(({ accountName }) => {
      lastAccountName = accountName;
      const status = document.getElementById('status');
      status.className = 'ok';
      status.textContent = t('qrConnected', { accountName });
    });
    window.gcQr.onLoginError((message) => {
      document.getElementById('status').className = 'err';
      document.getElementById('status').textContent = message;
    });
  </script>
</body>
</html>
