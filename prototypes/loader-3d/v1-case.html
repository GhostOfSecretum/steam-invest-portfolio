<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loader 3D · V1 Case Unlock</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<canvas id="scene"></canvas>
<div class="bg"></div>
<div class="grid"></div>

<div class="topbar">
  <a href="index.html">← все варианты</a>
  <span class="tag">V1 / CASE UNLOCK</span>
</div>

<div class="hud">
  <div class="eyebrow">// LIVE PORTFOLIO SYNC</div>
  <h1>Портфель</h1>
  <p>Загружаем портфель и цены...</p>
  <div class="progress" role="progressbar">
    <div class="meta">
      <span class="step" data-step-label>Читаем инвентарь</span>
      <span class="pct" data-pct>3%</span>
    </div>
    <div class="track"><span class="fill" data-fill></span></div>
    <div class="steps">
      <span data-step class="is-active">Читаем инвентарь</span>
      <span data-step>Сверяем цены</span>
      <span data-step>Строим аналитику</span>
    </div>
  </div>
</div>
<div class="note">three.js r160 · procedural · no textures</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { createApp, C, TAU, ease, smooth, hash } from './shared.js';

createApp({
  camera: { position: [0, 2.3, 7.4], target: [0, 0.55, 0] },
  build({ stage, camera }) {
    const root = new THREE.Group();
    stage.add(root);

    const shell = new THREE.MeshStandardMaterial({ color: 0x1a1e29, metalness: 0.75, roughness: 0.32 });
    const trim = new THREE.MeshStandardMaterial({ color: 0x2c3140, metalness: 0.9, roughness: 0.22 });
    const glow = new THREE.MeshBasicMaterial({ color: C.accent });
    const cyanGlow = new THREE.MeshBasicMaterial({ color: C.cyan });

    const W = 2.4, H = 1.0, D = 1.6;

    const body = new THREE.Mesh(new RoundedBoxGeometry(W, H, D, 4, 0.1), shell);
    body.position.y = H / 2;
    root.add(body);

    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.14, H + 0.04, 0.14), trim);
      bar.position.set(sx * (W / 2 - 0.05), H / 2, sz * (D / 2 - 0.05));
      root.add(bar);
    }

    const plate = new THREE.Mesh(
      new THREE.BoxGeometry(1.3, 0.34, 0.03),
      new THREE.MeshStandardMaterial({ color: 0x0b0d13, metalness: 0.4, roughness: 0.5, emissive: C.cyan, emissiveIntensity: 0.12 }),
    );
    plate.position.set(0, H * 0.5, D / 2 + 0.005);
    root.add(plate);
    const stripe = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.03), cyanGlow);
    stripe.position.set(0, H * 0.5 - 0.1, D / 2 + 0.03);
    root.add(stripe);
    const plateDot = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.06), glow);
    plateDot.position.set(-0.38, H * 0.5 + 0.06, D / 2 + 0.03);
    root.add(plateDot);

    const seam = new THREE.Mesh(new THREE.BoxGeometry(W - 0.1, 0.04, D - 0.1), glow);
    seam.position.y = H - 0.02;
    root.add(seam);
    // Unlit dark cap: the body top must read as a cavity, not a lit flat face,
    // and MeshBasicMaterial ignores the nearby point light.
    const cavity = new THREE.Mesh(
      new THREE.PlaneGeometry(W - 0.1, D - 0.1),
      new THREE.MeshBasicMaterial({ color: 0x07080d }),
    );
    cavity.rotation.x = -Math.PI / 2;
    cavity.position.y = H + 0.001;
    root.add(cavity);
    const cavityGlow = new THREE.Mesh(
      new THREE.PlaneGeometry(W - 0.5, D - 0.5),
      new THREE.MeshBasicMaterial({ color: C.accent, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }),
    );
    cavityGlow.rotation.x = -Math.PI / 2;
    cavityGlow.position.y = H + 0.004;
    root.add(cavityGlow);
    const inner = new THREE.PointLight(C.accent, 0, 6, 2);
    inner.position.set(0, H + 0.7, 0);
    root.add(inner);

    const lidPivot = new THREE.Group();
    lidPivot.position.set(0, H, -D / 2);
    root.add(lidPivot);
    const lid = new THREE.Mesh(new RoundedBoxGeometry(W, 0.34, D, 4, 0.1), shell);
    lid.position.set(0, 0.17, D / 2);
    lidPivot.add(lid);
    const lidTrim = new THREE.Mesh(new THREE.BoxGeometry(W * 0.6, 0.06, 0.24), trim);
    lidTrim.position.set(0, 0.36, D / 2);
    lidPivot.add(lidTrim);
    const lock = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.08, 32), trim);
    lock.rotation.x = Math.PI / 2;
    lock.position.set(0, 0.12, D + 0.03);
    lidPivot.add(lock);
    const lockLight = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.1, 24), new THREE.MeshBasicMaterial({ color: C.accent }));
    lockLight.rotation.x = Math.PI / 2;
    lockLight.position.copy(lock.position);
    lidPivot.add(lockLight);

    // Item cards: orbit above the case once it opens. Billboarded, so they live in stage (no rotation).
    const cards = [];
    const cardGeo = new THREE.PlaneGeometry(0.5, 0.7);
    const frameGeo = new THREE.PlaneGeometry(0.58, 0.78);
    for (let i = 0; i < 6; i++) {
      const col = C.rarity[i % 5];
      const g = new THREE.Group();
      const frame = new THREE.Mesh(frameGeo, new THREE.MeshBasicMaterial({
        color: col, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
      }));
      const face = new THREE.Mesh(cardGeo, new THREE.MeshStandardMaterial({
        color: 0x0f121a, emissive: col, emissiveIntensity: 0.3, metalness: 0.2, roughness: 0.6, side: THREE.DoubleSide,
      }));
      face.position.z = 0.005;
      const icon = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.28), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.55 }));
      icon.position.set(0, 0.08, 0.01);
      const bar = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.04), new THREE.MeshBasicMaterial({ color: col }));
      bar.position.set(0, -0.21, 0.01);
      const bar2 = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.03), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 }));
      bar2.position.set(-0.06, -0.28, 0.01);
      g.add(frame, face, icon, bar, bar2);
      stage.add(g);
      cards.push(g);
    }

    const N = 220;
    const pos = new Float32Array(N * 3);
    const seeds = Array.from({ length: N }, (_, i) => ({
      a: hash(i) * TAU, r: 0.15 + hash(i + 50) * 0.85, s: 0.25 + hash(i + 100) * 0.6, o: hash(i + 150),
    }));
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({
      color: C.accent, size: 0.045, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    root.add(pts);

    const ringBase = new THREE.Mesh(
      new THREE.RingGeometry(2.1, 2.16, 128),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.06, side: THREE.DoubleSide }),
    );
    ringBase.rotation.x = -Math.PI / 2;
    ringBase.position.y = 0.01;
    stage.add(ringBase);
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(2.1, 2.16, 128, 1, 0, 0.001),
      new THREE.MeshBasicMaterial({ color: C.accent, transparent: true, opacity: 0.9, side: THREE.DoubleSide }),
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.012;
    stage.add(ring);
    let ringPct = -1;

    const grid = new THREE.GridHelper(16, 32, 0x252b3a, 0x151925);
    grid.material.transparent = true;
    grid.material.opacity = 0.55;
    stage.add(grid);

    const floorGlow = new THREE.Mesh(
      new THREE.CircleGeometry(1.9, 64),
      new THREE.MeshBasicMaterial({ color: C.accent, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending, depthWrite: false }),
    );
    floorGlow.rotation.x = -Math.PI / 2;
    floorGlow.position.y = 0.005;
    stage.add(floorGlow);

    return {
      update({ t, progress }) {
        const open = ease(smooth(0.12, 0.85, progress));

        root.rotation.y = 0.45 + Math.sin(t * 0.35) * 0.4;
        root.position.y = Math.sin(t * 1.2) * 0.04;
        lidPivot.rotation.x = -open * 1.2;

        inner.intensity = 2 + open * 10 + Math.sin(t * 6) * 1.5 * open;
        cavityGlow.material.opacity = open * (0.28 + Math.sin(t * 5) * 0.06);
        lockLight.material.color.setHex(open > 0.6 ? C.cyan : C.accent);
        floorGlow.material.opacity = 0.06 + open * 0.14;

        cards.forEach((g, i) => {
          const k = ease(smooth(0.2 + i * 0.08, 0.5 + i * 0.08, progress));
          const a = t * 0.55 + (i * TAU) / cards.length;
          const r = 0.2 + k * 1.9;
          g.position.set(Math.cos(a) * r, 0.5 + k * (1.35 + Math.sin(t * 1.4 + i) * 0.12), Math.sin(a) * r * 0.5);
          g.scale.setScalar(0.15 + k * 0.85);
          g.visible = k > 0.001;
          g.quaternion.copy(camera.quaternion);
        });

        for (let i = 0; i < N; i++) {
          const s = seeds[i];
          const f = (t * s.s + s.o) % 1;
          const rr = s.r * (1 - f * 0.4);
          pos[i * 3] = Math.cos(s.a + t * 0.4) * rr;
          pos[i * 3 + 1] = H + f * 2.4 * open;
          pos[i * 3 + 2] = Math.sin(s.a + t * 0.4) * rr * 0.65;
        }
        pGeo.attributes.position.needsUpdate = true;
        pts.visible = open > 0.03;
        pts.material.opacity = 0.85 * open;

        const rp = Math.round(progress * 200);
        if (rp !== ringPct) {
          ringPct = rp;
          const len = Math.max(0.001, progress * TAU);
          ring.geometry.dispose();
          ring.geometry = new THREE.RingGeometry(2.1, 2.16, 128, 1, Math.PI / 2 - len, len);
        }
      },
    };
  },
});
</script>
</body>
</html>
