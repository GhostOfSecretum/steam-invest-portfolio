<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Steam Invest Portfolio</title>
<link rel="icon" type="image/png" href="logo-variant-08-favicon.png" />
<link rel="stylesheet" href="styles.css" />
<style>
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  .hero-3d-stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
</style>
</head>
<body>
  <div class="app-bg"></div>
  <div class="app-grid"></div>
  <div class="app-noise"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="api-client.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="hero.jsx"></script>
  <script type="text/babel" src="landing-sections.jsx"></script>
  <script type="text/babel" src="dashboard.jsx"></script>
  <script type="text/babel" src="item-detail.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "concept": "vault",
      "skin": "cyber",
      "glass": 2,
      "lang": "ru",
      "currency": "usd"
    }/*EDITMODE-END*/;
    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [screen, setScreen] = useState(window.location.hash === '#dashboard' ? 'dashboard' : 'home');
      const [activeItem, setActiveItem] = useState(null);
      const [itemReturnScreen, setItemReturnScreen] = useState('dashboard');
      const [cursorStyle, setCursorStyle] = useState('default');
      const [publicProfileUrl, setPublicProfileUrl] = useState('');
      const [pendingSection, setPendingSection] = useState(null);
      const auth = useAuth();
      const showDesktopDownload = false;

      // Set lang/currency globally so child components without prop access can read it
      useEffect(() => { window.__lang = t.lang; }, [t.lang]);
      useEffect(() => {
        window.__currency = t.currency || 'usd';
        window.dispatchEvent(new Event('currency-change'));
      }, [t.currency]);

      // Apply data-attrs to body for skin / glass
      useEffect(() => {
        document.body.dataset.skin = t.skin;
        document.body.dataset.glass = String(t.glass);
      }, [t.skin, t.glass]);
      useEffect(() => {
        if (screen !== 'home' || !pendingSection) return;
        const timer = window.setTimeout(() => {
          const target = document.getElementById(pendingSection);
          if (target) {
            const y = target.getBoundingClientRect().top + window.scrollY - 78;
            window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
          }
          setPendingSection(null);
        }, 40);
        return () => window.clearTimeout(timer);
      }, [screen, pendingSection]);
      const i18n = useT(t.lang);
      window.__lang = t.lang;
      window.__currency = t.currency || 'usd';

      const goItem = (item) => {
        setItemReturnScreen(screen);
        setActiveItem(item);
        setScreen('item');
        window.scrollTo({ top: 0, behavior: 'instant' });
      };
      const onNav = (s) => {
        if (s === 'news' || s === 'armory') {
          setPublicProfileUrl('');
          setPendingSection(s);
          setScreen('home');
          return;
        }
        if (s !== 'dashboard') setPublicProfileUrl('');
        setPendingSection(null);
        setScreen(s);
        window.scrollTo({top: 0, behavior: 'instant'});
      };
      const openPublicProfile = (profileUrl) => {
        setPublicProfileUrl(profileUrl);
        setScreen('dashboard');
        window.scrollTo({top: 0, behavior: 'instant'});
      };

      return (
        <div data-screen-label={`01 ${screen}`}>
          <TopNav
            screen={screen}
            onNav={onNav}
            lang={t.lang}
            onLang={(l) => setTweak('lang', l)}
            currency={t.currency || 'usd'}
            onCurrency={(value) => setTweak('currency', value)}
            t={i18n}
            auth={auth}
          />

          {screen === 'home' && (
            <>
              <Hero
                lang={t.lang}
                onLink={() => {
                  setPublicProfileUrl('');
                  onNav('dashboard');
                }}
                onPublicProfile={openPublicProfile}
                auth={auth}
              />
              {showDesktopDownload && <DesktopDownload lang={t.lang} />}
              <Ticker onItemClick={goItem} />
              <TopMovers onItemClick={goItem} auth={auth} />
              <MarketCatalog onItemClick={goItem} />
              <CaseROI />
              <ArmoryROI />
              <StatsBand />
              <FAQ lang={t.lang} />
              <Footer lang={t.lang} />
            </>
          )}
          {screen === 'dashboard' && (
            <Dashboard lang={t.lang} onItemClick={goItem} auth={auth} publicProfileUrl={publicProfileUrl} />
          )}
          {screen === 'item' && (
            <ItemDetail lang={t.lang} item={activeItem} onBack={() => onNav(itemReturnScreen)} />
          )}

          <CursorOverlay variant={cursorStyle} />

          <TweaksPanel title="Tweaks">
            <TweakSection label="Visual direction" />
            <TweakRadio
              label="Skin"
              value={t.skin}
              options={[
                { value: 'cyber', label: 'Cyber' },
                { value: 'tactical', label: 'Tactical' },
                { value: 'luxe', label: 'Luxe' },
              ]}
              onChange={(v) => setTweak('skin', v)}
            />
            <TweakSlider
              label="Glass intensity"
              value={t.glass} min={0} max={4} step={1}
              onChange={(v) => setTweak('glass', v)}
            />
            <TweakSection label="Locale" />
            <TweakRadio
              label="Language"
              value={t.lang}
              options={[
                { value: 'en', label: 'EN' },
                { value: 'ru', label: 'RU' },
              ]}
              onChange={(v) => setTweak('lang', v)}
            />
            <TweakRadio
              label="Currency"
              value={t.currency || 'usd'}
              options={[
                { value: 'usd', label: 'USD' },
                { value: 'rub', label: 'RUB' },
              ]}
              onChange={(v) => setTweak('currency', v)}
            />
            <TweakSection label="Cursor" />
            <TweakRadio
              label="Crosshair"
              value={cursorStyle}
              options={CURSOR_VARIANTS.map((item) => ({ value: item.id, label: item.labels[t.lang] || item.labels.en }))}
              onChange={setCursorStyle}
            />
            <TweakSection label="Navigate" />
            <TweakButton label="Home" onClick={() => onNav('home')} />
            <TweakButton label="Dashboard" onClick={() => onNav('dashboard')} />
            <TweakButton label="Item Detail" onClick={() => onNav('item')} />
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
