  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SITE_URL = 'https://skinshead.pro';
    const HOME_SEO = {
      ru: {
        title: 'SkinsHead — портфель скинов CS2 | CS2 Skin Portfolio Tracker',
        description: 'Skins Head — портфель скинов CS2: live-оценка инвентаря Steam, P&L, Маркет, ROI Armory Pass, новости; desktop-приложение — скоро на skinshead.pro',
      },
      en: {
        title: 'SkinsHead — CS2 Skin Portfolio Tracker',
        description: 'SkinsHead is a CS2 skin portfolio tracker with live Steam inventory valuation, P&L, market explorer, Armory Pass ROI, and Telegram news. Desktop sync for Хранилища is coming soon.',
      },
    };

    function upsertMeta(attr, key, value) {
      const selector = attr === 'property'
        ? `meta[property="${key}"]`
        : `meta[name="${key}"]`;
      let node = document.head.querySelector(selector);
      if (!node) {
        node = document.createElement('meta');
        node.setAttribute(attr, key);
        document.head.appendChild(node);
      }
      node.setAttribute('content', value);
    }

    function upsertCanonical(url) {
      let node = document.head.querySelector('link[rel="canonical"]');
      if (!node) {
        node = document.createElement('link');
        node.setAttribute('rel', 'canonical');
        document.head.appendChild(node);
      }
      node.setAttribute('href', url);
    }

    const APP_ROUTE_SEO = {
      favorites: { ru: 'Избранные профили · SkinsHead', en: 'Favorite profiles · SkinsHead' },
      dashboard: { ru: 'Портфель · SkinsHead', en: 'Portfolio · SkinsHead' },
      investors: { ru: 'Топ инвесторы · SkinsHead', en: 'Top investors · SkinsHead' },
      market: { ru: 'Маркет · SkinsHead', en: 'Market · SkinsHead' },
      armory: { ru: 'Armory Pass · SkinsHead', en: 'Armory Pass · SkinsHead' },
      glock3d: { ru: '3D Glock · SkinsHead', en: '3D Glock · SkinsHead' },
      collection: { ru: 'Коллекция · SkinsHead', en: 'Collection · SkinsHead' },
    };

    function applyHomeSeo(lang) {
      const copy = HOME_SEO[lang] || HOME_SEO.en;
      document.title = copy.title;
      upsertMeta('name', 'description', copy.description);
      upsertMeta('name', 'robots', 'index, follow, max-image-preview:large');
      upsertCanonical(`${SITE_URL}/`);
      upsertMeta('property', 'og:title', copy.title);
      upsertMeta('property', 'og:description', copy.description);
      upsertMeta('property', 'og:url', `${SITE_URL}/`);
      upsertMeta('property', 'og:type', 'website');
    }

    function applyAppRouteSeo(lang, screen) {
      const titles = APP_ROUTE_SEO[screen];
      const title = titles?.[lang] || titles?.en || 'SkinsHead';
      const home = HOME_SEO[lang] || HOME_SEO.en;
      document.title = title;
      upsertMeta('name', 'description', home.description);
      upsertMeta('name', 'robots', 'noindex, follow');
      upsertCanonical(`${SITE_URL}/`);
      upsertMeta('property', 'og:title', title);
      upsertMeta('property', 'og:description', home.description);
      upsertMeta('property', 'og:url', `${SITE_URL}/`);
      upsertMeta('property', 'og:type', 'website');
    }

    function applyItemSeo(item, lang) {
      if (!item?.marketHashName || !window.ItemSlugs) return;
      const seo = window.ItemSlugs.buildItemSeoMeta({
        marketHashName: item.marketHashName,
        slug: window.ItemSlugs.marketHashNameToSlug(item.marketHashName),
        price: item.price,
        iconUrl: item.iconUrl,
        siteUrl: SITE_URL,
      });
      const title = lang === 'ru'
        ? `${item.marketHashName}${Number.isFinite(item.price) ? ` — $${item.price.toFixed(2)}` : ''} | цена CS2 · SkinsHead`
        : seo.title;
      const description = lang === 'ru' ? seo.descriptionRu : seo.description;
      document.title = title;
      upsertMeta('name', 'description', description);
      upsertMeta('name', 'robots', 'index, follow, max-image-preview:large');
      upsertCanonical(seo.url);
      upsertMeta('property', 'og:title', title);
      upsertMeta('property', 'og:description', description);
      upsertMeta('property', 'og:url', seo.url);
      upsertMeta('property', 'og:type', 'product');
      if (item.iconUrl) upsertMeta('property', 'og:image', item.iconUrl);
    }

    function parseAppRoute() {
      const path = window.location.pathname.replace(/\/+$/, '') || '/';
      const profile = String(new URLSearchParams(window.location.search).get('profile') || '').trim();
      if (path.startsWith('/item/')) {
        const slug = decodeURIComponent(path.slice('/item/'.length)).toLowerCase();
        if (slug) return { screen: 'item', slug };
      }
      if (path.startsWith('/collection/')) {
        const slug = decodeURIComponent(path.slice('/collection/'.length)).toLowerCase();
        if (slug) return { screen: 'collection', collectionSlug: slug };
      }
      if (path === '/favorites') {
        return { screen: 'favorites' };
      }
      if (path === '/investors') {
        return { screen: 'investors' };
      }
      if (path === '/market') {
        return { screen: 'market' };
      }
      if (path === '/armory') {
        return { screen: 'armory' };
      }
      if (path === '/glock-3d' || path === '/glock3d') {
        return { screen: 'glock3d' };
      }
      if (path === '/dashboard' || window.location.hash === '#dashboard') {
        return { screen: 'dashboard', profile: profile || '' };
      }
      return { screen: 'home' };
    }

    function pathForScreen(screen, item, profileUrl = '', collectionSlug = '') {
      if (screen === 'favorites') return '/favorites';
      if (screen === 'investors') return '/investors';
      if (screen === 'market') return '/market';
      if (screen === 'armory') return '/armory';
      if (screen === 'glock3d') return '/glock-3d';
      if (screen === 'dashboard') {
        if (profileUrl) return `/dashboard?profile=${encodeURIComponent(profileUrl)}`;
        return '/dashboard';
      }
      if (screen === 'item' && item?.marketHashName && window.ItemSlugs) {
        return `/item/${window.ItemSlugs.marketHashNameToSlug(item.marketHashName)}`;
      }
      if (screen === 'collection' && collectionSlug) {
        return `/collection/${encodeURIComponent(collectionSlug)}`;
      }
      return '/';
    }

    function syncAppUrl(screen, item, { replace = false, profileUrl = '', collectionSlug = '' } = {}) {
      const nextPath = pathForScreen(screen, item, profileUrl, collectionSlug);
      const current = `${window.location.pathname}${window.location.search}`;
      if (current === nextPath) return;
      const state = {
        screen,
        slug: screen === 'item' ? window.ItemSlugs?.marketHashNameToSlug(item?.marketHashName) : null,
        collectionSlug: screen === 'collection' ? collectionSlug || null : null,
        profileUrl: profileUrl || null,
      };
      if (replace) history.replaceState(state, '', nextPath);
      else history.pushState(state, '', nextPath);
    }

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "concept": "vault",
      "skin": "cyber",
      "glass": 2,
      "lang": "ru",
      "currency": "rub"
    }/*EDITMODE-END*/;
    function App() {
      const initialRoute = parseAppRoute();
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [screen, setScreen] = useState(initialRoute.screen);
      const [itemSlug, setItemSlug] = useState(initialRoute.slug || null);
      const [collectionSlug, setCollectionSlug] = useState(initialRoute.collectionSlug || null);
      const [activeItem, setActiveItem] = useState(null);
      const [itemReturnScreen, setItemReturnScreen] = useState(
        initialRoute.screen === 'item' || initialRoute.screen === 'collection' ? 'home' : initialRoute.screen
      );
      const [cursorStyle, setCursorStyle] = useState('default');
      const [publicProfileUrl, setPublicProfileUrl] = useState(initialRoute.profile || '');
      const [pendingSection, setPendingSection] = useState(null);
      const auth = useAuth();
      const slugMatchesItem = Boolean(
        activeItem?.marketHashName
        && itemSlug
        && window.ItemSlugs
        && window.ItemSlugs.marketHashNameToSlug(activeItem.marketHashName) === itemSlug
      );
      const slugItem = useItemBySlug(itemSlug, screen === 'item' && itemSlug && !slugMatchesItem);
      const collectionState = useCollectionBySlug(collectionSlug, screen === 'collection' && Boolean(collectionSlug));

      // Set lang/currency globally so child components without prop access can read it
      useEffect(() => { window.__lang = t.lang; }, [t.lang]);
      useEffect(() => {
        window.__currency = t.currency || 'rub';
        window.dispatchEvent(new Event('currency-change'));
      }, [t.currency]);

      // Apply data-attrs to body for skin / glass
      useEffect(() => {
        document.body.dataset.skin = t.skin;
        document.body.dataset.glass = String(t.glass);
      }, [t.skin, t.glass]);
      useEffect(() => {
        document.documentElement.lang = t.lang === 'ru' ? 'ru' : 'en';
        if (screen === 'item' && activeItem) applyItemSeo(activeItem, t.lang);
        else if (screen === 'collection' && collectionState.data?.collection) {
          const name = collectionState.data.collection.name;
          applyAppRouteSeo(t.lang, 'collection');
          document.title = t.lang === 'ru'
            ? `${name} · коллекция CS2 · SkinsHead`
            : `${name} · CS2 collection · SkinsHead`;
        }
        else if (screen === 'home') applyHomeSeo(t.lang);
        else applyAppRouteSeo(t.lang, screen);
      }, [t.lang, screen, activeItem, collectionState.data]);
      useEffect(() => {
        if (screen !== 'item' || !slugItem.data) return;
        setActiveItem(slugItem.data);
      }, [screen, slugItem.data]);
      useEffect(() => {
        const onPopState = () => {
          const route = parseAppRoute();
          setScreen(route.screen);
          setItemSlug(route.slug || null);
          setCollectionSlug(route.collectionSlug || null);
          setPublicProfileUrl(route.profile || '');
          if (route.screen !== 'item') setActiveItem(null);
        };
        window.addEventListener('popstate', onPopState);
        return () => window.removeEventListener('popstate', onPopState);
      }, []);
      useEffect(() => {
        if (window.location.hash === '#dashboard' && screen !== 'dashboard') {
          history.replaceState({ screen: 'dashboard' }, '', '/dashboard');
          setScreen('dashboard');
        }
      }, []);
      useEffect(() => {
        if (screen !== 'home' || !pendingSection) return;
        const timer = window.setTimeout(() => {
          const target = document.getElementById(pendingSection);
          if (target) {
            const y = target.getBoundingClientRect().top + window.scrollY - 78;
            window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
          }
          setPendingSection(null);
        }, 40);
        return () => window.clearTimeout(timer);
      }, [screen, pendingSection]);
      const i18n = useT(t.lang);
      window.__lang = t.lang;
      window.__currency = t.currency || 'rub';

      const goItem = (item) => {
        const slug = window.ItemSlugs?.marketHashNameToSlug(item.marketHashName);
        setItemReturnScreen(screen === 'collection' ? 'collection' : screen);
        setActiveItem(item);
        setItemSlug(slug || null);
        setScreen('item');
        syncAppUrl('item', item);
        if (item) applyItemSeo(item, t.lang);
        window.scrollTo({ top: 0, behavior: 'instant' });
      };
      const goCollection = (collectionName, slug) => {
        const nextSlug = slug
          || (collectionName && window.ItemSlugs?.collectionNameToSlug
            ? window.ItemSlugs.collectionNameToSlug(collectionName)
            : null);
        if (!nextSlug) return;
        setItemReturnScreen(screen === 'item' ? itemReturnScreen : screen);
        setCollectionSlug(nextSlug);
        setItemSlug(null);
        setActiveItem(null);
        setScreen('collection');
        syncAppUrl('collection', null, { collectionSlug: nextSlug });
        window.scrollTo({ top: 0, behavior: 'instant' });
      };
      const onNav = (s) => {
        if (s === 'pricing' || s === 'news' || s === 'desktop') {
          setPublicProfileUrl('');
          setPendingSection(s);
          setScreen('home');
          setItemSlug(null);
          setCollectionSlug(null);
          setActiveItem(null);
          syncAppUrl('home');
          return;
        }
        if (s !== 'dashboard') setPublicProfileUrl('');
        setPendingSection(null);
        setScreen(s);
        if (s !== 'item') {
          setItemSlug(null);
          setActiveItem(null);
        }
        if (s !== 'collection') setCollectionSlug(null);
        syncAppUrl(s, null, { profileUrl: s === 'dashboard' ? publicProfileUrl : '' });
        if (s === 'home') applyHomeSeo(t.lang);
        else if (s !== 'item') applyAppRouteSeo(t.lang, s);
        window.scrollTo({top: 0, behavior: 'instant'});
      };
      const openPublicProfile = (profileUrl) => {
        const nextUrl = String(profileUrl || '').trim();
        setPublicProfileUrl(nextUrl);
        setScreen('dashboard');
        setItemSlug(null);
        setCollectionSlug(null);
        setActiveItem(null);
        syncAppUrl('dashboard', null, { profileUrl: nextUrl });
        window.scrollTo({top: 0, behavior: 'instant'});
      };
      const openOwnPortfolio = () => {
        setPublicProfileUrl('');
        if (auth?.connected) {
          onNav('dashboard');
          return;
        }
        if (auth?.login) auth.login();
        else onNav('dashboard');
      };

      return (
        <div data-screen-label={`01 ${screen}`}>
          <TopNav
            screen={screen}
            onNav={onNav}
            lang={t.lang}
            onLang={(l) => setTweak('lang', l)}
            currency={t.currency || 'rub'}
            onCurrency={(value) => setTweak('currency', value)}
            t={i18n}
            auth={auth}
          />

          {screen === 'home' && (
            <>
              <Hero
                lang={t.lang}
                onLink={openOwnPortfolio}
                onPublicProfile={openPublicProfile}
                onItemClick={goItem}
                auth={auth}
              />
              <HowItWorks lang={t.lang} />
              <ProductShowcase lang={t.lang} />
              <StatsBand />
              <Ticker onItemClick={goItem} />
              <Pricing lang={t.lang} auth={auth} onInvestors={() => onNav('investors')} />
              {/* Desktop coming soon */}
              <DesktopDownload lang={t.lang} auth={auth} onPricing={() => onNav('pricing')} />
              {/* Portfolio leaders temporarily hidden — keep TopMovers in code to restore later */}
              {false && <TopMovers onItemClick={goItem} auth={auth} />}
              {/* News block temporarily hidden — keep CaseROI in code to restore later */}
              {false && <CaseROI />}
              <SeoIntro lang={t.lang} />
              <FAQ lang={t.lang} />
              <FinalCta lang={t.lang} auth={auth} onPrimary={openOwnPortfolio} />
              <Footer lang={t.lang} />
            </>
          )}
          {screen === 'dashboard' && (
            <Dashboard lang={t.lang} onItemClick={goItem} onCollectionClick={goCollection} auth={auth} publicProfileUrl={publicProfileUrl} onPublicProfile={openPublicProfile} onPricing={() => onNav('pricing')} />
          )}
          {screen === 'market' && (
            <>
              <MarketCatalog onItemClick={goItem} onCollectionClick={goCollection} />
              <Footer lang={t.lang} />
            </>
          )}
          {screen === 'armory' && (
            <>
              <ArmoryROI />
              <Footer lang={t.lang} />
            </>
          )}
          {screen === 'favorites' && (
            <FavoriteProfiles lang={t.lang} onOpenProfile={openPublicProfile} />
          )}
          {screen === 'investors' && (
            <TopInvestorsPage
              lang={t.lang}
              auth={auth}
              onOpenProfile={openPublicProfile}
              onPricing={() => onNav('pricing')}
            />
          )}
          {screen === 'glock3d' && (
            <Glock3DPage lang={t.lang} />
          )}
          {screen === 'item' && (
            <ItemDetail
              lang={t.lang}
              item={activeItem}
              loading={!activeItem && slugItem.loading}
              error={!activeItem ? slugItem.error : null}
              onBack={() => {
                if (itemReturnScreen === 'collection' && collectionSlug) {
                  setScreen('collection');
                  setActiveItem(null);
                  setItemSlug(null);
                  syncAppUrl('collection', null, { collectionSlug });
                  return;
                }
                onNav(itemReturnScreen);
              }}
              onCollectionClick={goCollection}
            />
          )}
          {screen === 'collection' && (
            <CollectionDetail
              lang={t.lang}
              slug={collectionSlug}
              loading={collectionState.loading}
              error={collectionState.error}
              data={collectionState.data}
              onBack={() => onNav(itemReturnScreen === 'collection' ? 'market' : itemReturnScreen)}
              onItemClick={goItem}
              onLoadMore={collectionState.loadMore}
            />
          )}

          <CursorOverlay variant={cursorStyle} />

          <TweaksPanel title="Tweaks">
            <TweakSection label="Visual direction" />
            <TweakRadio
              label="Skin"
              value={t.skin}
              options={[
                { value: 'cyber', label: 'Cyber' },
                { value: 'tactical', label: 'Tactical' },
                { value: 'luxe', label: 'Luxe' },
              ]}
              onChange={(v) => setTweak('skin', v)}
            />
            <TweakSlider
              label="Glass intensity"
              value={t.glass} min={0} max={4} step={1}
              onChange={(v) => setTweak('glass', v)}
            />
            <TweakSection label="Locale" />
            <TweakRadio
              label="Language"
              value={t.lang}
              options={[
                { value: 'en', label: 'EN' },
                { value: 'ru', label: 'RU' },
              ]}
              onChange={(v) => setTweak('lang', v)}
            />
            <TweakRadio
              label="Currency"
              value={t.currency || 'rub'}
              options={[
                { value: 'rub', label: 'RUB' },
                { value: 'usd', label: 'USD' },
              ]}
              onChange={(v) => setTweak('currency', v)}
            />
            <TweakSection label="Cursor" />
            <TweakRadio
              label="Crosshair"
              value={cursorStyle}
              options={CURSOR_VARIANTS.map((item) => ({ value: item.id, label: item.labels[t.lang] || item.labels.en }))}
              onChange={setCursorStyle}
            />
            <TweakSection label="Navigate" />
            <TweakButton label="Home" onClick={() => onNav('home')} />
            <TweakButton label="Dashboard" onClick={() => onNav('dashboard')} />
            <TweakButton label="Favorites" onClick={() => onNav('favorites')} />
